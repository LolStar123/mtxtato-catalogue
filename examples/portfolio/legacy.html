<!doctype html>
<html lang="en">
    <meta charset="utf-8" /><meta
        name="viewport"
        content="width=device-width,initial-scale=1"
    /><title>mtxtato / effect wardrobe</title
    ><link rel="stylesheet" href="legacy.css" />
    <body>
<p class="archive-notice">Archive · <a href="https://lolstar123.github.io/smoothtato-preview/cosmetics/">Current app</a>.</p>
        <header>
            <a href="https://poetato.app">poetato / mtxtato</a>
            <nav>
                <a href="https://github.com/LolStar123/mtxtato-catalogue"
                    >code</a
                ><a
                    href="https://lolstar123.github.io/just-a-little-further/"
                    >projects</a
                >
            </nav>
        </header>
        <main>
            <div class="title">
                <div>
                    <h1>mtxtato</h1>
                </div>
                <p id="summary">Loading…</p>
            </div>
            <div class="filters">
                <label
                    >search<input
                        id="search"
                        type="search"
                        placeholder="celestial, arc, righteous fire..." /></label
                ><label
                    >skill<select id="skill">
                        <option value="">all skills</option>
                    </select></label
                ><label
                    >confidence<select id="confidence">
                        <option value="">all entries</option>
                        <option>HIGH</option>
                        <option>MEDIUM</option>
                        <option>LOW</option>
                    </select></label
                >
            </div>
            <div class="workspace">
                <section>
                    <div class="results-head">
                        <p id="count"></p>
                        <div>
                            <button id="prev">previous</button
                            ><button id="next">next</button>
                        </div>
                    </div>
                    <div id="catalogue"></div>
                </section>
                <aside id="effect-desk">
                    <a class="back-to-catalogue" href="#catalogue"
                        >effects</a
                    >
                    <h2 id="effect-title">Select effect</h2>
                    <div id="preview"></div>
                    <p id="blurb"></p>
                    <p id="evidence"></p>
                    <button id="add">Add</button>
                    <h3>Loadout <span id="loadout-count">0</span></h3>
                    <div id="loadout"></div>
                    <p id="status" role="status"></p>
                    <button id="export">Export STATO1</button>
                    <details>
                        <summary>Import</summary>
                        <label
                            >STATO1 code<textarea
                                id="import-code"
                                rows="4"
                            ></textarea></label
                        ><button id="import">Import effects</button>
                    </details>
                    <details>
                        <summary>Mappings</summary>
                        <pre id="pairs"></pre>
                    </details>
                </aside>
            </div>
            <footer>Catalogue confidence; game-version compatibility unverified. Preview artwork © respective owners. <a href="https://github.com/LolStar123/mtxtato-catalogue#checks-and-limits">Method</a></footer>
        </main>
        <script type="module" src="app.mjs"></script>
    </body>
</html>
